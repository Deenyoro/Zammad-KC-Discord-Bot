services:
  discord-bot:
    build: .
    image: zammad-kc-discord-bot:latest
    container_name: zammad-discord-bot
    restart: unless-stopped
    env_file: .env
    # Only needed when Zammad reaches the bot through the host. Bound to
    # localhost; on a shared Docker network you can remove it.
    ports:
      - "127.0.0.1:3100:3100"
    volumes:
      - ./data:/app/data
    networks:
      - default
      - zammad

networks:
  zammad:
    external: true
    name: zammad-kc_default
