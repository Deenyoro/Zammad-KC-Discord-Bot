# Container images for Zammad-KC-Discord-Bot, built on GitLab and mirrored to GHCR.
#
# Ported from .github/workflows/build-and-push.yml, GitHub Actions is disabled on the
# repository, so this is the only thing that builds these images. Pipelines run
# on a v* tag, or manually from the UI/API (set RELEASE_VERSION=v1.2.3 to stamp
# a version without tagging, DOCKER_PUSH=false to build without publishing).
#
# The check job (test stage) gates the image build: npm ci, type check, lint,
# build and `npm test` on the Dockerfile's Node image, plus a release version
# check against package.json. A failed check means no image is built or pushed.
#
# Merge requests (e.g. Renovate MRs) also get a pipeline, via the template's
# workflow rules: tests and image builds only. The template never pushes,
# mirrors to GHCR or releases from an MR pipeline, and release jobs here are
# kept off MRs.

include:
  - project: dean/ci-templates
    ref: main
    file: /docker.yml

variables:
  # Same base image as both Dockerfile stages; ci/check.sh fails if they drift.
  NODE_IMAGE: node:24-alpine

check:
  stage: test
  tags: [linux]
  image: $NODE_IMAGE
  interruptible: true
  variables:
    GIT_DEPTH: "1"
    NPM_CACHE_DIR: $CI_PROJECT_DIR/.npm
  cache:
    key: npm-node24
    paths: [.npm/]
  script:
    - sh ci/check.sh

build:
  extends: .docker-build
  parallel:
    matrix:
    - IMAGE: zammad-kc-discord-bot
      CONTEXT: .

# Starts the image with the shipped docker-compose.yml on a fresh (missing)
# ./data and on a root-owned ./data with an existing database (ci/compose-test.sh).
# Runs on merge requests that touch the image or compose file, and before
# every release.
compose-test:
  stage: test
  tags: [linux]
  image: docker:27
  services: ["docker:27-dind"]
  interruptible: true
  variables:
    DOCKER_HOST: tcp://docker:2376
    DOCKER_TLS_VERIFY: "1"
    DOCKER_CERT_PATH: /certs/client
    DOCKER_BUILDKIT: "1"
    GIT_DEPTH: "1"
  rules:
    - if: $CI_PIPELINE_SOURCE == "merge_request_event"
      changes: [Dockerfile, docker-entrypoint.sh, docker-compose.yml, ci/compose-test.sh, package.json, package-lock.json]
    - if: $CI_COMMIT_TAG =~ /^v/
    - if: $CI_PIPELINE_SOURCE == "web" || $CI_PIPELINE_SOURCE == "api"
  script:
    - for _ in $(seq 1 30); do docker info >/dev/null 2>&1 && break; sleep 2; done
    - sh ci/compose-test.sh
